name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      # dist/ is committed (for `yarn add github:` consumers); fail if it drifts from source.
      - name: Verify committed dist matches source
        run: git diff --exit-code dist

      - run: npm test

      - run: npm audit --omit=dev || true
